  Facebook Lead Ads belongs to) is versioned in lockstep with it. Entries are organised by
  API VERSION rather than by date-of-change, and each version carries an explicit expiry —
  the changelog and the deprecation policy are the same document in practice. Recent window
  only; the live changelog is the source of truth.
