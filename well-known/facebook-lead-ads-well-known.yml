source: live probe of the /.well-known/ surface on every Facebook Lead Ads host
note: >-
  Probed every host this product uses — the Graph API base (graph.facebook.com),
  the developer portal / docs host (developers.facebook.com), the OAuth dialog host
  (www.facebook.com) and the Meta-hosted Ads MCP host (mcp.facebook.com). One real
  document was served: the OpenID Connect discovery document at
  https://www.facebook.com/.well-known/openid-configuration, which is the discovery
  surface behind the Facebook Login / Meta Business Login flow that issues the Page
  access tokens this API requires. Everything else 404s (developers.facebook.com),
  400s with a Graph API OAuthException "Unknown path components" (graph.facebook.com),
  or 400s with an HTML error page (www.facebook.com). No security.txt is served on
  any host. mcp.facebook.com answers /.well-known/* with a JSON 404
  ("MCP server not found for path: ..."), so the Ads MCP server publishes neither
  RFC 9728 protected-resource metadata nor RFC 8414 authorization-server metadata.
