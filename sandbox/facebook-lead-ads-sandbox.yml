time_simulation:
  supported: false
  note: No test clocks or time-travel fixtures.
webhook_testing:
  supported: true
  mechanism: >-
    The Lead Ads Testing Tool fires a real leadgen webhook notification at the subscribed
    callback URL, and the App Dashboard's Webhooks product page offers a "Test" button that
    sends a sample payload per field.
  detail: asyncapi/facebook-lead-ads-webhooks.yml
