aid: facebook-lead-ads
name: Facebook Lead Ads
description: >-
  Facebook Lead Ads (part of the Meta Marketing API) lets advertisers create
  instant lead-generation forms on Facebook and Instagram and programmatically
  retrieve the leads captured through those forms. Through the Meta Graph API
  developers can list lead generation forms on a Page, read submitted leads,
  download bulk lead exports, and subscribe to webhooks for real-time lead
  delivery. Authentication uses Page access tokens issued via Facebook Login /
  Meta Business Login with the leads_retrieval, pages_show_list, and
  pages_manage_ads permissions.
type: Index
