source: >-
  Public registry metadata endpoints (registry.npmjs.org, pypi.org, rubygems.org,
  packagist.org, search.maven.org, azuresearch-usnc.nuget.org), queried 2026-08-14.
note: >-
  Facebook Lead Ads is an endpoint family of the Meta Marketing API (Graph API), and
  Meta does not ship a lead-ads-specific client library. The first-party clients are
  the Meta Business SDKs — one per language, published from github.com/facebook,
  versioned in lockstep with the Graph API version (SDK major = Graph API version,
  e.g. 26.x = Graph API v26.0). Every entry below is first-party (published from the
  facebook GitHub org and linked from developers.facebook.com/docs/business-sdk).
  Currency finding: the Python, PHP and Ruby SDKs track the current Graph API version
  (26.0, released within the last two weeks); the Node.js SDK is two major versions
  behind (24.0.1, 2025-11-21) and the Java SDK is three behind (23.0.0, 2025-06-17).
  No first-party .NET/NuGet or Go client exists — NuGet search returns only
  third-party packages.
