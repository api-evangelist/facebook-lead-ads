source: https://developers.facebook.com/docs/graph-api/guides/versioning
note: >-
  Facebook Lead Ads has no lifecycle policy of its own — it inherits the Graph API's,
  which is one of the most explicit versioning contracts any large platform publishes.
  The version facts below were confirmed BOTH from the docs and by probing the live API:
  requesting each version path and reading the facebook-api-version response header.
