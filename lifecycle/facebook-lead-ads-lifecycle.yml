deprecation:
  policy_url: https://developers.facebook.com/docs/graph-api/guides/versioning
  guarantee: >-
    "Each version will remain for at least 2 years from release." A version is no longer
    usable two years after the date its successor is released; calls to an expired version
    are defaulted to the next oldest usable version rather than failing.
  security_carve_out: >-
    "Facebook does reserve the right to make changes in any API in a short period of time
    for issues related to security or privacy."
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  proprietary_signal:
    header: x-ad-api-version-warning
    value_observed: You are calling a deprecated version of the Ads API.
    observed_on: [v22.0, v23.0]
    absent_on: [v24.0, v25.0, v26.0]
    note: >-
      Meta signals Ads API deprecation on the wire with a proprietary header rather than
      RFC 8594 Deprecation/Sunset. An agent that only watches for standard headers will
      never see it.
  finding: >-
    The OpenAPI documents in this repo pin https://graph.facebook.com/v22.0, and the live
    API returns x-ad-api-version-warning for that version. The spec is describing a Graph
    API version Meta has already flagged as deprecated for Ads. Per the published policy,
    v22.0 (released 2025-01-21) remains usable until 2027-05-20.
