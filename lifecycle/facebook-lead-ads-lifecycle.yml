  scheme: uri-path
  pattern: https://graph.facebook.com/v{MAJOR}.{MINOR}/...
  current: v26.0
  default_when_unversioned: v20.0
  response_header: facebook-api-version
  docs: https://developers.facebook.com/docs/graph-api/guides/versioning
  probe:
    date: '2026-08-14'
    method: 'GET https://graph.facebook.com/{version}/me, reading facebook-api-version'
