scope_note: >-
  This is Meta's own hosted MCP server for the ads surface — one of the "Meta ads AI
  connectors" — and Facebook Lead Ads is an endpoint family of that same Meta Marketing
  API (Graph API). Meta does not publish a lead-ads-specific MCP server. The published
  tool categories (reporting, ad creation and management, catalog, signals and datasets,
  help, A/B tests, activity logs) do not name a leadgen-forms or lead-retrieval tool, and
  the live tool list is auth-gated, so it cannot be confirmed from outside whether the
  lead-ads endpoints in openapi/ are reachable through it. Recorded as the provider's
  agent surface with that limitation stated, not as a lead-ads tool inventory.
