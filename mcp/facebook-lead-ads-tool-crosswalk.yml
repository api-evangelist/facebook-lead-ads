note: >-
  A crosswalk between Meta's hosted Ads MCP server and the Facebook Lead Ads OpenAPI
  operations in this repo. It is deliberately an EMPTY-BINDING crosswalk, and that is the
  finding: Meta ships a remote MCP server for the ads surface, but the seven tool categories
  it publishes are campaign/catalog/reporting-shaped and none of them names a leadgen-forms
  or lead-retrieval capability. The live tools/list is auth-gated (HTTP 401), so individual
  tool names and inputSchemas could not be captured and no binding can be asserted at
  operation granularity without fabricating it. Every lead-ads operation is therefore
  recorded as rest_only until an authenticated introspection pass proves otherwise.
